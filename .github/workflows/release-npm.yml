name: Publish CodeLocal to npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Internal second-stage release tag. Leave empty for a manual release reservation.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: codelocal-npm-${{ inputs.release_tag != '' && 'publish' || 'prepare' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == '0xmarkhydra/codex-mcp' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate source version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(node -p "require('./package.json').version")"
          runtime_version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' internal/version/version.go)"

          if [[ -z "$source_version" || -z "$runtime_version" ]]; then
            echo 'Could not resolve package/runtime version.' >&2
            exit 1
          fi
          if [[ "$source_version" != "$runtime_version" ]]; then
            echo "Version mismatch: package.json=$source_version runtime=$runtime_version" >&2
            exit 1
          fi
          if [[ ! "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Source version must be a stable semver, got: $source_version" >&2
            exit 1
          fi
          echo "version=$source_version" >> "$GITHUB_OUTPUT"

      - name: Resolve next unreserved release version
        id: release
        shell: bash
        env:
          SOURCE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          latest="$(npm view 'codelocal@latest' version --prefer-online 2>/dev/null || true)"
          version="$(node - "$SOURCE_VERSION" "$latest" <<'NODE'
          const [source, latest] = process.argv.slice(2);
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value || '');
            if (!match) throw new Error(`Invalid stable semver: ${value}`);
            return match.slice(1).map(Number);
          };
          const compare = (a, b) => {
            for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) return a[i] - b[i];
            return 0;
          };
          let next = parse(source);
          if (latest) {
            const latestParts = parse(latest);
            const bumpedLatest = [latestParts[0], latestParts[1], latestParts[2] + 1];
            if (compare(bumpedLatest, next) > 0) next = bumpedLatest;
          }
          process.stdout.write(next.join('.'));
          NODE
          )"

          bump_patch() {
            node - "$1" <<'NODE'
          const parts = process.argv[2].split('.').map(Number);
          if (parts.length !== 3 || parts.some(Number.isNaN)) process.exit(1);
          parts[2] += 1;
          process.stdout.write(parts.join('.'));
          NODE
          }

          while git rev-parse -q --verify "refs/tags/codelocal-v$version" >/dev/null 2>&1 || \
            npm view "codelocal@$version" version --prefer-online >/dev/null 2>&1; do
            version="$(bump_patch "$version")"
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=codelocal-v$version" >> "$GITHUB_OUTPUT"

      - name: Create immutable release commit and tag
        id: tagged
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --ignore-scripts

          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const runtimePath = 'internal/version/version.go';
          const runtime = fs.readFileSync(runtimePath, 'utf8');
          const pattern = /^const Version = "[^"]*"$/m;
          if (!pattern.test(runtime)) throw new Error('Could not update runtime version constant.');
          fs.writeFileSync(runtimePath, runtime.replace(pattern, `const Version = "${version}"`));
          NODE

          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          runtime_version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' internal/version/version.go)"
          if [[ "$package_version" != "$VERSION" || "$lock_version" != "$VERSION" || "$lock_root_version" != "$VERSION" || "$runtime_version" != "$VERSION" ]]; then
            echo "Failed to materialize release version: package=$package_version lock=$lock_version lockRoot=$lock_root_version runtime=$runtime_version expected=$VERSION" >&2
            exit 1
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json internal/version/version.go
          git commit -m "release: codelocal v$VERSION"
          release_sha="$(git rev-parse HEAD)"
          git tag "$TAG" "$release_sha"
          git push origin "refs/tags/$TAG"

          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Created immutable release source $TAG at $release_sha (parent $GITHUB_SHA)."

      - name: Dispatch publish from exact release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release-npm.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f "release_tag=$TAG"
          echo "Dispatched publish stage from $TAG."

  native-macos:
    if: github.repository == '0xmarkhydra/codex-mcp' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            swift_arch: arm64
            goarch: arm64
          - runner: macos-15-intel
            swift_arch: x86_64
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1

      - name: Verify native runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.swift_arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          if [[ "$actual" != "$EXPECTED_ARCH" ]]; then
            echo "Unexpected macOS runner architecture: expected=$EXPECTED_ARCH actual=$actual" >&2
            exit 1
          fi
          swiftc --version

      - name: Build native macOS Computer worker
        shell: bash
        env:
          SWIFT_ARCH: ${{ matrix.swift_arch }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p native-artifact
          output="native-artifact/computer-native-darwin-$GOARCH"
          swiftc -O -target "$SWIFT_ARCH-apple-macos14.0" cmd/computernative/main.swift -o "$output"
          chmod 755 "$output"
          capabilities="$("$output" --capabilities)"
          if [[ "$capabilities" != *'"ready":true'* || "$capabilities" != *'"nativeAXBackend":true'* ]]; then
            echo "Native worker capability handshake failed: $capabilities" >&2
            exit 1
          fi
          echo "Built $output on $(uname -m)."

      - name: Sign and notarize native macOS Computer worker when configured
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          REQUIRE_APPLE_SIGNING: ${{ vars.CODELOCAL_REQUIRE_APPLE_SIGNING }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          output="native-artifact/computer-native-darwin-$GOARCH"
          signing_values=("$APPLE_CERTIFICATE_P12_BASE64" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_DEVELOPER_ID_APPLICATION")
          signing_count=0
          for value in "${signing_values[@]}"; do [[ -n "$value" ]] && signing_count=$((signing_count + 1)); done
          if [[ "$signing_count" -eq 0 ]]; then
            if [[ "${REQUIRE_APPLE_SIGNING:-}" == "true" ]]; then
              echo "Apple signing is required but Developer ID certificate secrets are not configured." >&2
              exit 1
            fi
            echo "Apple Developer ID secrets are not configured; shipping the compatibility unsigned native worker."
            exit 0
          fi
          if [[ "$signing_count" -ne 3 ]]; then
            echo "Apple signing configuration is partial; configure certificate, password and Developer ID identity together." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/codelocal-signing-$GOARCH.keychain-db"
          certificate="$RUNNER_TEMP/codelocal-signing-$GOARCH.p12"
          keychain_password="codelocal-$GITHUB_RUN_ID-$GOARCH"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$RUNNER_TEMP/codelocal-native-$GOARCH.zip"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          codesign --force --timestamp --options runtime --keychain "$keychain" --sign "$APPLE_DEVELOPER_ID_APPLICATION" "$output"
          codesign --verify --strict --verbose=2 "$output"
          codesign -dv --verbose=2 "$output" 2>&1 | grep -F 'Authority=Developer ID Application' >/dev/null
          echo "Developer ID signature verified for $output."

          notary_values=("$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_SPECIFIC_PASSWORD")
          notary_count=0
          for value in "${notary_values[@]}"; do [[ -n "$value" ]] && notary_count=$((notary_count + 1)); done
          if [[ "$notary_count" -eq 0 ]]; then
            echo "Notary credentials are not configured; keeping the verified Developer ID signed worker."
            exit 0
          fi
          if [[ "$notary_count" -ne 3 ]]; then
            echo "Apple notarization configuration is partial; configure Apple ID, team ID and app-specific password together." >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/codelocal-native-$GOARCH.zip"
          ditto -c -k --sequesterRsrc --keepParent "$output" "$archive"
          xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          echo "Apple notarization accepted for $output."

      - name: Upload native macOS Computer worker
        uses: actions/upload-artifact@v4
        with:
          name: codelocal-native-${{ matrix.goarch }}
          path: native-artifact/computer-native-darwin-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: native-macos
    if: github.repository == '0xmarkhydra/codex-mcp' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate publish ref
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$REQUESTED_TAG" ]]; then
            echo "Publish stage must run from its exact release tag: requested=$REQUESTED_TAG actual=$GITHUB_REF_TYPE/$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_TAG" =~ ^codelocal-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid CodeLocal release tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "version=${REQUESTED_TAG#codelocal-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag, commit and source versions match
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-list -n 1 "$TAG")"
          head_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          runtime_version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' internal/version/version.go)"

          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "Tag/source mismatch: tag=$tag_sha checkout=$head_sha" >&2
            exit 1
          fi
          if [[ "$package_version" != "$VERSION" || "$lock_version" != "$VERSION" || "$lock_root_version" != "$VERSION" || "$runtime_version" != "$VERSION" ]]; then
            echo "Release source mismatch: package=$package_version lock=$lock_version lockRoot=$lock_root_version runtime=$runtime_version expected=$VERSION" >&2
            exit 1
          fi
          echo "Verified $TAG -> $head_sha -> source version $VERSION."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global 'npm@^11.5.1'
          node --version
          npm --version

      - name: Check whether exact release is already published
        id: registry
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "codelocal@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "codelocal@$VERSION is already on npm; publish stage is idempotent."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify release package
        if: steps.registry.outputs.published != 'true'
        run: npm run release:prepare

      - name: Download native macOS Computer workers
        if: steps.registry.outputs.published != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: codelocal-native-*
          path: .release/npm/bin/helpers
          merge-multiple: true

      - name: Validate native macOS Computer workers
        if: steps.registry.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in computer-native-darwin-arm64 computer-native-darwin-amd64; do
            path=".release/npm/bin/helpers/$name"
            if [[ ! -f "$path" ]]; then
              echo "Missing packaged native Computer worker: $path" >&2
              exit 1
            fi
            chmod 755 "$path"
            if [[ ! -x "$path" ]]; then
              echo "Native Computer worker is not executable: $path" >&2
              exit 1
            fi
          done
          ls -lh .release/npm/bin/helpers/computer-native-darwin-*

      - name: Validate staged npm metadata
        if: steps.registry.outputs.published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          staged_version="$(node -p "require('./.release/npm/package.json').version")"
          repository_url="$(node -p "require('./.release/npm/package.json').repository?.url || ''")"
          if [[ "$staged_version" != "$VERSION" ]]; then
            echo "Staged version mismatch: expected $VERSION, got $staged_version" >&2
            exit 1
          fi
          if [[ "$repository_url" != 'https://github.com/0xmarkhydra/codex-mcp.git' ]]; then
            echo "Unexpected repository.url: $repository_url" >&2
            exit 1
          fi
          node .release/npm/bin/codelocal.js --version

      - name: Publish to npm with GitHub OIDC
        if: steps.registry.outputs.published != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm publish ./.release/npm --tag latest --access public

      - name: Verify npm registry
        if: steps.registry.outputs.published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            published="$(npm view "codelocal@$VERSION" version --prefer-online 2>/dev/null || true)"
            latest="$(npm view 'codelocal@latest' version --prefer-online 2>/dev/null || true)"
            if [[ "$published" == "$VERSION" && "$latest" == "$VERSION" ]]; then
              echo "Published codelocal@$VERSION and latest now points to it."
              exit 0
            fi
            echo "Registry sync $attempt/20: version=${published:-pending}, latest=${latest:-pending}"
            sleep 3
          done
          echo "npm registry did not converge to codelocal@$VERSION in time." >&2
          exit 1
