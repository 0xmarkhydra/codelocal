name: CodeLocal CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  linux-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Security regression tests
        run: node --test dist/__tests__/security-policy.test.js dist/__tests__/editing-engine.test.js dist/__tests__/device-store.test.js

  packaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: CLI smoke
        run: node dist/cli.js status
