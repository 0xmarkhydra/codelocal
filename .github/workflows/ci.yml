name: CodeLocal CI

on:
  push:
    branches: [main, dev, go-migration]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build native commands
        run: go build ./cmd/...

  packaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build cross-platform npm staging package
        run: go run ./cmd/release
      - name: Inspect npm package
        run: npm pack --dry-run ./.release/npm
      - name: Native CLI smoke
        run: node .release/npm/bin/codelocal.js --version

  cloud-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build Cloud image
        run: docker build -t codelocal-cloud:ci .

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build Next.js web image
        run: >-
          docker build
          --file Dockerfile.web
          --build-arg CODELOCAL_BACKEND_URL=http://codelocal-backend.railway.internal:3333
          --tag codelocal-web:ci
          .
