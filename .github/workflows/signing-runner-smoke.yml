name: CodeLocal Signing Runner Smoke

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/signing-runner-smoke.yml'

permissions:
  contents: read

jobs:
  signing-smoke:
    runs-on: [codelocal-signing]
    timeout-minutes: 5
    steps:
      - name: Verify Developer ID signing from self-hosted runner
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_DEVELOPER_ID_APPLICATION" ]]; then
            echo "APPLE_DEVELOPER_ID_APPLICATION is not configured." >&2
            exit 1
          fi

          target="$RUNNER_TEMP/codelocal-signing-smoke"
          cleanup() { rm -f "$target"; }
          trap cleanup EXIT

          cp /usr/bin/true "$target"
          chmod 755 "$target"
          codesign --force --timestamp --options runtime --sign "$APPLE_DEVELOPER_ID_APPLICATION" "$target"
          codesign --verify --strict --verbose=2 "$target"
          codesign -dv --verbose=2 "$target" 2>&1 | grep -F 'Authority=Developer ID Application' >/dev/null
          echo "Self-hosted Developer ID signing smoke test passed."
