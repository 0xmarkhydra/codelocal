name: CodeLocal Cloud CI

on:
  push:
    branches: [main, dev, go-migration]
    paths:
      - 'cmd/codelocal-cloud/**'
      - 'cmd/codelocal-cloud-runtime/**'
      - 'internal/clientupdate/**'
      - 'internal/cloud/**'
      - 'internal/cloudserver/**'
      - 'internal/deviceauth/**'
      - 'internal/gateway/**'
      - 'internal/identity/**'
      - 'internal/learnedskills/**'
      - 'internal/localfs/**'
      - 'internal/lsp/**'
      - 'internal/mailer/**'
      - 'internal/mcpgateway/**'
      - 'internal/memory/**'
      - 'internal/oauth/**'
      - 'internal/orchestration/**'
      - 'internal/project/**'
      - 'internal/projectbrain/**'
      - 'internal/projectidentity/**'
      - 'internal/protocol/**'
      - 'internal/repository/**'
      - 'internal/runtime/**'
      - 'internal/security/**'
      - 'internal/social/**'
      - 'internal/state/**'
      - 'internal/taskstate/**'
      - 'internal/usage/**'
      - 'internal/version/**'
      - 'internal/webauth/**'
      - 'internal/webutil/**'
      - 'internal/workspace/**'
      - 'assets/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Dockerfile.runtime'
      - 'railway.json'
  pull_request:
    paths:
      - 'cmd/codelocal-cloud/**'
      - 'cmd/codelocal-cloud-runtime/**'
      - 'internal/clientupdate/**'
      - 'internal/cloud/**'
      - 'internal/cloudserver/**'
      - 'internal/deviceauth/**'
      - 'internal/gateway/**'
      - 'internal/identity/**'
      - 'internal/learnedskills/**'
      - 'internal/localfs/**'
      - 'internal/lsp/**'
      - 'internal/mailer/**'
      - 'internal/mcpgateway/**'
      - 'internal/memory/**'
      - 'internal/oauth/**'
      - 'internal/orchestration/**'
      - 'internal/project/**'
      - 'internal/projectbrain/**'
      - 'internal/projectidentity/**'
      - 'internal/protocol/**'
      - 'internal/repository/**'
      - 'internal/runtime/**'
      - 'internal/security/**'
      - 'internal/social/**'
      - 'internal/state/**'
      - 'internal/taskstate/**'
      - 'internal/usage/**'
      - 'internal/version/**'
      - 'internal/webauth/**'
      - 'internal/webutil/**'
      - 'internal/workspace/**'
      - 'assets/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Dockerfile.runtime'
      - 'railway.json'
  workflow_dispatch:

jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Test cloud packages
        run: go test ./cmd/codelocal-cloud ./cmd/codelocal-cloud-runtime ./internal/cloud/... ./internal/cloudserver/... ./internal/gateway/... ./internal/identity/... ./internal/mcpgateway/... ./internal/workspace/...
      - name: Vet cloud packages
        run: go vet ./cmd/codelocal-cloud ./cmd/codelocal-cloud-runtime ./internal/cloud/... ./internal/cloudserver/... ./internal/gateway/... ./internal/identity/... ./internal/mcpgateway/... ./internal/workspace/...
      - name: Build cloud commands
        run: |
          go build ./cmd/codelocal-cloud
          go build ./cmd/codelocal-cloud-runtime

  cloud-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build Cloud image
        run: docker build -t codelocal-cloud:ci .
      - name: Build Cloud Runtime image
        run: docker build -f Dockerfile.runtime -t codelocal-runtime:ci .
