name: One-shot context refresh hotfix

on:
  push:
    branches: [fix/context-refresh-recoverable]
    paths: [.github/workflows/hotfix-context-refresh.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/context-refresh-recoverable
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Apply exact continuity fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          engine = Path('internal/localclient/engine.go')
          text = engine.read_text()
          old = '''\tfor _, path := range explicit {
          \tappendPath(path)
          \tif len(out) >= 32 {
          \t\treturn out
          \t}
          }
          \t// Ranked files remain useful'''.replace('          ', '')
          new = '''\tfor _, path := range explicit {
          \tappendPath(path)
          \tif len(out) >= 32 {
          \t\treturn out
          \t}
          }
          \tif len(out) > 0 {
          \treturn out
          }
          \t// Ranked files remain useful'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'engine target patch expected 1 match, got {text.count(old)}')
          engine.write_text(text.replace(old, new, 1))

          task = Path('internal/mcpgateway/task_memory.go')
          text = task.read_text()
          marker = '''\tresult.StructuredContent = root
          \tresult.IsError = true
          \treturn result
          }

          func (s *Service) refreshProjectBrainBeforeMutation'''.replace('          ', '')
          replacement = marker.replace('result.IsError = true', 'result.IsError = false')
          if text.count(marker) != 1:
              raise SystemExit(f'context refresh patch expected 1 match, got {text.count(marker)}')
          task.write_text(text.replace(marker, replacement, 1))

          Path('internal/localclient/project_brain_targets_test.go').write_text('''package localclient

          import "testing"

          func TestProjectBrainTargetsExplicitDoNotIncludeRanked(t *testing.T) {
          \tresult := map[string]any{"rankedFiles": []map[string]any{{"path": "unrelated.go"}}}
          \tgot := projectBrainTargets(result, []string{"internal/localclient/engine.go"})
          \tif len(got) != 1 || got[0] != "internal/localclient/engine.go" {
          \t\tt.Fatalf("explicit targets must remain isolated, got %#v", got)
          \t}
          }
          '''.replace('          ', ''))

          Path('internal/mcpgateway/context_refresh_result_test.go').write_text('''package mcpgateway

          import "testing"

          func TestContextRefreshRequiredIsRecoverable(t *testing.T) {
          \tresult := textResult(map[string]any{"projectBrain": map[string]any{}}, false)
          \tgot := contextRefreshRequired(result, []string{"internal/localclient/engine.go"})
          \tif got == nil {
          \t\tt.Fatal("expected result")
          \t}
          \tif got.IsError {
          \t\tt.Fatal("context refresh is recoverable and must not be an MCP tool error")
          \t}
          \troot := resultRoot(got)
          \tif root["status"] != "context_refresh_required" {
          \t\tt.Fatalf("unexpected status: %#v", root["status"])
          \t}
          }
          '''.replace('          ', ''))
          PY
      - name: Format and test
        shell: bash
        run: |
          gofmt -w internal/localclient/engine.go internal/localclient/project_brain_targets_test.go internal/mcpgateway/task_memory.go internal/mcpgateway/context_refresh_result_test.go
          go test ./internal/localclient ./internal/mcpgateway ./internal/mcphub
          git diff --check
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/localclient/engine.go internal/localclient/project_brain_targets_test.go internal/mcpgateway/task_memory.go internal/mcpgateway/context_refresh_result_test.go
          git commit -m 'fix: keep Project Brain refresh recoverable'
          git push origin HEAD:fix/context-refresh-recoverable
